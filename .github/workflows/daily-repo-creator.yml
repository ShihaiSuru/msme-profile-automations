name: Daily MSME Fintech Repo Creator

on:
  schedule:
    # Every day at 04:30 UTC (10:00 AM IST)
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  create-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Generate unique idea and name
        id: generate
        run: |
          DATE=$(date +%Y%m%d)
          DAY=$(date +%j)
          REPO_NAME="msme-fintech-${DATE}"
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT

          IDEAS=(
            "Cash flow forecasting script for MSMEs"
            "Invoice aging analyzer tool"
            "GST compliance checklist generator"
            "UPI payment reconciliation helper"
            "MSME grant eligibility checker"
            "Payment delay risk calculator"
            "Working capital requirement estimator"
            "Simple receivables dashboard generator"
          )
          IDEA=${IDEAS[$((DAY % ${#IDEAS[@]}))]}
          echo "idea=${IDEA}" >> $GITHUB_OUTPUT

      - name: Create repository
        id: create
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATOR_TOKEN }}
          REPO_NAME: ${{ steps.generate.outputs.repo_name }}
          IDEA: ${{ steps.generate.outputs.idea }}
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/repos \
            -d "{\"name\":\"${REPO_NAME}\",\"description\":\"${IDEA}\",\"private\":false,\"auto_init\":true}")
          echo "$RESPONSE"
          echo "Created: ${REPO_NAME}"

      - name: Add starter Python script
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATOR_TOKEN }}
          REPO_NAME: ${{ steps.generate.outputs.repo_name }}
          IDEA: ${{ steps.generate.outputs.idea }}
        run: |
          SCRIPT='#!/usr/bin/env python3
"""
'