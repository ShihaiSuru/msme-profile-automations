name: Daily MSME Fintech Repo Creator

on:
  schedule:
    - cron: '30 4 * * *'  # Daily 10:00 AM IST
  workflow_dispatch:

jobs:
  create-and-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Generate name and idea
        id: gen
        run: |
          DATE=$(date +%Y%m%d)
          DAY=$(date +%j)
          echo "repo_name=msme-fintech-${DATE}" >> $GITHUB_OUTPUT
          IDEAS=("Cash flow forecasting script" "Invoice aging analyzer" "GST compliance checklist" "UPI reconciliation helper" "Grant eligibility checker" "Payment delay calculator" "Working capital estimator")
          echo "idea=${IDEAS[$((DAY % ${#IDEAS[@]}))]}" >> $GITHUB_OUTPUT

      - name: Create repository
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATOR_TOKEN }}
          REPO_NAME: ${{ steps.gen.outputs.repo_name }}
          IDEA: ${{ steps.gen.outputs.idea }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/user/repos -d "{\"name\":\"$REPO_NAME\",\"description\":\"$IDEA\",\"private\":false,\"auto_init\":true}"

      - name: Add starter Python script
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATOR_TOKEN }}
          REPO_NAME: ${{ steps.gen.outputs.repo_name }}
          IDEA: ${{ steps.gen.outputs.idea }}
